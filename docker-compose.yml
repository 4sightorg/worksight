version: '3.9'
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: worksight_postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: worksight
      POSTGRES_PASSWORD: worksight
      POSTGRES_DB: worksight
    volumes:
      - worksight_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U worksight -d worksight']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    container_name: worksight_web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - apps/web/.env.example
    restart: unless-stopped

  docs:
    container_name: worksight_docs
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    ports:
      - '8080:8080'
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    container_name: sgsite-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - docs

volumes:
  worksight_pg:

